services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ministryhub_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ministryhub_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-ministryhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ministryhub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # NestJS Backend API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ministryhub_api
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ministryhub_secure_pwd}@postgres:5432/${POSTGRES_DB:-ministryhub}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ministryhub_jwt_secret_key_prod_2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  # ==========================================
  # React / Vite Web Frontend (Nginx)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ministryhub_web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  api_uploads:
