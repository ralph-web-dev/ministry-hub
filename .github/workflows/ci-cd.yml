name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/ministryhub-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/ministryhub-web

jobs:
  # ==========================================
  # JOB 1: Build & Push Images
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: Deploy to AWS
  # ==========================================
  deploy-to-aws:
    name: Deploy to AWS Lightsail
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            echo "Pulling latest changes and images..."
            cd ~/ministry-hub
            git pull origin main
            
            # Login to GitHub Container Registry to pull images
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Stop the old build process if it's running
            docker compose -f docker-compose.prod.yml down || true
            
            # Pull and start new pre-built images
            docker compose -f docker-compose.registry.yml pull
            docker compose -f docker-compose.registry.yml up -d
            
            echo "Applying database migrations..."
            docker compose -f docker-compose.registry.yml exec -T -w /app/packages/database api npx prisma db push
            
            echo "Deployment completed successfully!"
